name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @spenditure/api db:generate

      - name: Build web app
        run: pnpm --filter @spenditure/web build
        env:
          NODE_ENV: production

      - name: Generate OpenAPI spec
        run: pnpm --filter @spenditure/api run docs:generate
        env:
          DATABASE_URL: file:./gen.db
          NODE_ENV: development
          JWT_SECRET: placeholder-secret-32-chars-for-spec
          JWT_REFRESH_SECRET: placeholder-refresh-32-chars-spec

      - name: Deploy API docs to bump.sh
        uses: bump-sh/github-action@v1
        with:
          doc: spenditure
          token: ${{ secrets.BUMP_TOKEN }}
          file: apps/api/openapi.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/web/dist/**

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @spenditure/api db:generate

      - name: Build web app
        run: pnpm --filter @spenditure/web build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
