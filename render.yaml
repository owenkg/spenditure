services:
  # --- Backend API ---
  - type: web
    name: spenditure-api
    env: node
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile; pnpm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set manually in Render dashboard (sensitive):
      # JWT_SECRET, JWT_REFRESH_SECRET, FRONTEND_URL
    disk:
      name: spenditure-data
      mountPath: /var/data
      sizeGB: 1

  # --- Frontend static site ---
  - type: static_site
    name: spenditure
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @spenditure/web build
    staticPublishPath: apps/web/build/client
    autoDeploy: true
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://spenditure-api.onrender.com
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
